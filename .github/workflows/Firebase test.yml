name: Kadwise Firebase Test Lab

on:
  workflow_dispatch:

jobs:
  firebase-test-lab:
    name: Build and Run Firebase Test Lab
    runs-on: windows-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle files + Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            **/.gradle/build-cache
            composeApp/build
            shared/build
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-${{ hashFiles('gradle.properties', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x ./gradlew

      - name: Build debug APK and androidTest APK
        shell: bash
        run: |
          echo "🚀 Building Kadwise APKs for Firebase Test Lab..."
          ./gradlew \
            :composeApp:assembleDebug \
            :composeApp:assembleAndroidTest \
            --build-cache --stacktrace --info

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCLOUD_SERVICE_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Firebase Test Lab instrumentation tests
        shell: bash
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --app "composeApp/build/outputs/apk/debug/composeApp-debug.apk" \
            --test "composeApp/build/outputs/apk/androidTest/debug/composeApp-debug-androidTest.apk" \
            --device model=Pixel5,version=30,locale=en,orientation=portrait \
            --timeout 15m \
            --results-bucket "gs://${{ secrets.FTL_RESULTS_BUCKET }}" \
            --results-dir "kadwise-${{ github.run_id }}"

      - name: Upload built APKs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kadwise-ftl-build-artifacts
          path: |
            composeApp/build/outputs/apk/debug/*.apk
            composeApp/build/outputs/apk/androidTest/debug/*.apk
